[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moumantai-backend"
version = "0.1.0"
description = "MouManTAI shared FastAPI foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.context" = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app/context/tests"]
addopts = "-q"
markers = [
  "postgres: mark test as requiring real PostgreSQL database (strict mode via REQUIRE_POSTGRES=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
