name: Staging release check

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed Main commit SHA to verify for staging
        required: true

concurrency:
  group: moumantai-staging-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
      - name: Select reviewed Main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
          echo "Release candidate: $(git rev-parse HEAD)"
      - name: Build and verify isolated staging stack
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          umask 077
          {
            echo 'STAGING_DB_USER=moumantai_staging'
            echo "STAGING_DB_PASSWORD=$secret"
            echo "STAGING_DATABASE_URL=postgresql+psycopg://moumantai_staging:$secret@db:5432/moumantai_staging"
            echo 'STAGING_ORIGIN=https://staging.example.invalid'
            echo 'STAGING_LOCAL_PORT=18080'
          } > "$RUNNER_TEMP/moumantai-staging.env"
          echo "STAGING_ENV_FILE=$RUNNER_TEMP/moumantai-staging.env" >> "$GITHUB_ENV"
          docker compose --env-file "$RUNNER_TEMP/moumantai-staging.env" -f docker-compose.staging.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/moumantai-staging.env" -f docker-compose.staging.yml build
          docker compose --env-file "$RUNNER_TEMP/moumantai-staging.env" -f docker-compose.staging.yml up -d db migrate api worker frontend
          docker compose --env-file "$RUNNER_TEMP/moumantai-staging.env" -f docker-compose.staging.yml exec -T api alembic -c alembic.ini current --check-heads
          docker compose --env-file "$RUNNER_TEMP/moumantai-staging.env" -f docker-compose.staging.yml exec -T api python scripts/staging_smoke.py
          curl --retry 12 --retry-delay 5 --retry-connrefused -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/overview >/dev/null
      - name: Failure logs
        if: failure()
        shell: bash
        run: docker compose --env-file "$STAGING_ENV_FILE" -f docker-compose.staging.yml logs --tail=120 api worker migrate frontend
      - name: Stop disposable stack
        if: always()
        shell: bash
        run: docker compose --env-file "$STAGING_ENV_FILE" -f docker-compose.staging.yml down -v --remove-orphans
