name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (pytest & syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Syntax and compile check
        run: |
          python -m compileall -q backend/app

      - name: Run pytest test suite (unit, concurrency, outbox, E2E)
        run: |
          pytest -v backend/tests

  frontend-checks:
    name: Frontend Checks (Typecheck, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  hygiene-check:
    name: Hygiene & Secret Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .env.example contains placeholders only
        run: |
          test -f .env.example || { echo "ERROR: Missing .env.example file"; exit 1; }
          # Scan for leaked API keys, tokens, or private key blocks
          if grep -iE "(ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z]+ PRIVATE KEY)" .env.example; then
            echo "ERROR: Real secret or private key pattern found in .env.example!"
            exit 1
          fi
          echo "Verified: .env.example contains safe placeholders only."

      - name: Verify zero deprecated PromiseFlow branding in UI and code
        run: |
          echo "Scanning frontend, backend, and contracts for legacy branding..."
          MATCHES=$(grep -rn "PromiseFlow" frontend/src backend/app contracts 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Found leftover 'PromiseFlow' references in UI or codebase:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Verified: zero leftover 'PromiseFlow' references found."
