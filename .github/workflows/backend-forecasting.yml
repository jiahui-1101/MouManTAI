name: Backend Forecasting

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "backend/app/forecasting/**"
      - "backend/pyproject.toml"
      - ".github/workflows/backend-forecasting.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/app/forecasting/**"
      - "backend/pyproject.toml"
      - ".github/workflows/backend-forecasting.yml"

concurrency:
  group: backend-forecasting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forecasting:
    name: Backend F Forecasting Tests
    runs-on: ubuntu-latest
    env:
      DISABLE_SQLALCHEMY_CEXT: "1"
      MOUMANTAI_SYNTHETIC_MODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary=sqlalchemy -e "./backend[dev]"

      - name: Run forecasting tests
        run: pytest backend/app/forecasting/tests -v
