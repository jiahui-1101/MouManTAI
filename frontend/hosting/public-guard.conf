# Public HTTPS gateway adapter. TLS termination and trusted operator identity
# must be supplied by the selected host before privileged routes are enabled.
# This file is intentionally safe to use before that contract is approved.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-store always;

    location = /healthz { return 200 "ok\n"; }

    # The Vite middleware is absent from a production build. No synthetic key,
    # header identity, or privileged API is reachable through this gateway.
    location ^~ /demo-bff/ { return 503; }
    location ^~ /v1/ { return 404; }
    location ^~ /internal/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
